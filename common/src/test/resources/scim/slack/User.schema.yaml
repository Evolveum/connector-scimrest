objectClasses:
  User:
    scim:
      # Only listed attributes are supported
      onlyExplicitlyListed: true
      # FIXME: define format how to map extension to container (short names are not part of protocol)
      extensions:
        slack: "urn:ietf:params:scim:schemas:extension:slack:profile:2.0:User"
        enterprise: "urn:ietf:params:scim:schemas:extension:enterprise:2.0:User"

    attributes:
      userName:
      nickName:
      displayName:
      title:
      email:
        scim:
          path: emails[0].value
      profile_photo:
        scim:
          path: photos[0].values
      password:

    references:
      groups:
