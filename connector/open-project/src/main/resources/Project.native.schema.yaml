objectClasses:
  Project:
    description: "Projects are containers structuring the information (e.g. work packages, wikis) into smaller groups."
    attributes:
      id:
        jsonType: integer
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: true
        description: "Projects’ id"
      name:
        jsonType: string
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: true
        description: "Group’s full name, formatting depends on instance settings"
      created_at:
        jsonType: string
        openApiFormat: date-time
        readable: true
        updateable: false
        creatable: false
        returnedByDefault: true
        required: false
        description: "Time of creation"
      updated_at:
        jsonType: string
        openApiFormat: date-time
        readable: true
        updateable: false
        creatable: false
        returnedByDefault: true
        required: false
        description: "Time of the most recent change to the project"
      identifier:
        jsonType: string
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: true
      active:
        jsonType: boolean
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: false
        description: "Indicates whether the project is currently active or already archived"
      statusExplanation:
        complexType: Formattable
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: false
      public:
        jsonType: boolean
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: false
        description: "Indicates whether the project is accessible for everybody"
      description:
        complexType: Formattable
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: false
