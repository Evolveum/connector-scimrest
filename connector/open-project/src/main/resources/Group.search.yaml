# Imports: org.json.JSONArray
objectClasses:
  Group:
    search:
      endpoints:
        - path: groups/
          objectExtractor: |
            import org.json.JSONArray;
            if(response.body()==null){
                return new JSONArray();
            }

            return response.body().get("_embedded").get("elements");
          emptyFilterSupported: true
        - path: groups/{id}
          singleResult: true
          notFoundIsNoResult: true
          supportedFilters:
            - spec: attribute("id").eq().anySingleValue()
              request: |
                request.pathParameter("id", value)
