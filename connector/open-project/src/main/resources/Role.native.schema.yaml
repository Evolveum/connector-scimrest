objectClasses:
  Role:
    description: "When principals (groups or users) are assigned to a project, they are receive roles in that project."
    attributes:
      id:
        jsonType: integer
        readable: true
        updateable: false
        creatable: false
        returnedByDefault: true
        required: true
        description: "Role id"
      name:
        jsonType: string
        readable: true
        updateable: true
        creatable: true
        returnedByDefault: true
        required: true
        description: "Group’s full name, formatting depends on instance settings"
